<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УГД — Систем за Евиденција на Студенти</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background: #F5F5F5;
            color: #231F20;
        }

        /* ========== LOGIN ========== */
        #loginPage {
            display: flex;
            min-height: 100vh;
        }

        .login-left {
            flex: 1;
            background: #D71920;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 48px;
            color: white;
        }

        .login-left .ugd-label {
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .login-left h1 {
            font-size: 42px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            line-height: 1.1;
        }

        .login-left .divider {
            width: 48px;
            height: 3px;
            background: white;
            margin-bottom: 16px;
        }

        .login-left p {
            font-size: 15px;
            color: rgba(255,255,255,0.8);
            text-align: center;
            max-width: 280px;
            line-height: 1.6;
        }

        .login-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 48px;
            background: white;
        }

        .login-form-box {
            width: 100%;
            max-width: 380px;
        }

        .login-form-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #231F20;
            margin-bottom: 4px;
        }

        .login-form-box .subtitle {
            font-size: 13px;
            color: #58595B;
            margin-bottom: 32px;
        }

        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #58595B;
            margin-bottom: 6px;
        }

        .field-input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 2px solid #E6E7E8;
            background: transparent;
            font-size: 15px;
            font-family: 'Roboto', sans-serif;
            color: #231F20;
            outline: none;
            margin-bottom: 24px;
            transition: border-color 0.2s;
        }

        .field-input:focus { border-bottom-color: #D71920; }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #D71920;
            color: white;
            border: none;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover { background: #a11418; }

        .error-msg {
            color: #D71920;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }

        @media (max-width: 768px) {
            #loginPage { flex-direction: column; }
            .login-left { padding: 32px; }
            .login-left h1 { font-size: 28px; }
        }

        /* ========== DASHBOARD ========== */
        #dashboard { display: none; }

        .navbar {
            background: #231F20;
            color: white;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-brand .ugd-dot {
            width: 8px;
            height: 8px;
            background: #D71920;
        }

        .navbar-brand span {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-badge {
            font-size: 13px;
            color: #A7A9AC;
        }

        .btn-logout {
            background: #D71920;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-logout:hover { background: #a11418; }

        .main-content { padding: 32px; }

        /* ========== STATS ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-left: 4px solid #D71920;
        }

        .stat-card .number {
            font-size: 40px;
            font-weight: 700;
            color: #D71920;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-card .label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #58595B;
        }

        @media (max-width: 900px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* ========== CHARTS ========== */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: white;
            padding: 24px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #58595B;
            margin-bottom: 4px;
        }

        .section-divider {
            width: 32px;
            height: 2px;
            background: #D71920;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
        }

        /* ========== FILTERS ========== */
        .filters-card {
            background: white;
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-field {
            flex: 1;
            min-width: 140px;
        }

        .filter-input {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 2px solid #E6E7E8;
            background: transparent;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            color: #231F20;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-input:focus { border-bottom-color: #D71920; }

        .btn-filter {
            padding: 10px 20px;
            background: #D71920;
            color: white;
            border: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-filter:hover { background: #a11418; }

        .btn-reset {
            padding: 10px 20px;
            background: #58595B;
            color: white;
            border: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-reset:hover { background: #231F20; }

        /* ========== TABLE ========== */
        .table-card {
            background: white;
            overflow: hidden;
        }

        .table-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #E6E7E8;
        }

        .btn-sync {
            padding: 8px 16px;
            background: #231F20;
            color: white;
            border: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-sync:hover { background: #D71920; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #F5F5F5;
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #58595B;
            border-bottom: 2px solid #E6E7E8;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #E6E7E8;
            font-size: 14px;
            color: #231F20;
        }

        tr:hover td { background: #FFF5F5; }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: #D71920;
            color: white;
        }

        /* ========== PROGRESS ========== */
        .progress-container {
            display: none;
            padding: 12px 24px;
            background: #F5F5F5;
            border-bottom: 1px solid #E6E7E8;
        }

        .progress-bar-track {
            background: #E6E7E8;
            height: 4px;
            margin-bottom: 6px;
        }

        .progress-bar-fill {
            background: #D71920;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 12px;
            color: #58595B;
        }

        /* ========== PAGINATION ========== */
        .pagination {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #E6E7E8;
        }

        .pagination-info {
            font-size: 13px;
            color: #58595B;
        }

        .pagination-buttons { display: flex; gap: 4px; }

        .btn-page {
            padding: 8px 14px;
            border: 1px solid #E6E7E8;
            background: white;
            font-size: 13px;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            transition: all 0.15s;
            color: #231F20;
        }

        .btn-page:hover { background: #D71920; color: white; border-color: #D71920; }
        .btn-page.active { background: #D71920; color: white; border-color: #D71920; }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ========== LOADING ========== */
        .loading {
            text-align: center;
            padding: 48px;
            color: #58595B;
        }

        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #E6E7E8;
            border-top-color: #D71920;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="loginPage">
    <div class="login-left">
        <div class="ugd-label">Универзитет</div>
        <h1>Гоце<br>Делчев</h1>
        <div class="divider"></div>
        <p>Систем за евиденција на присуство на студенти</p>
    </div>
    <div class="login-right">
        <div class="login-form-box">
            <h2>Најава</h2>
            <p class="subtitle">Внесете ги вашите УГД credentials</p>

            <label class="field-label">Е-маил</label>
            <input type="email" id="loginEmail" class="field-input" placeholder="name@ugd.edu.mk"/>

            <label class="field-label">Лозинка</label>
            <input type="password" id="loginPassword" class="field-input" placeholder="••••••••"/>

            <button class="btn-login" onclick="login()">Најава</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </div>
</div>

<!-- ========== DASHBOARD ========== -->
<div id="dashboard">
    <nav class="navbar">
        <div class="navbar-brand">
            <div class="ugd-dot"></div>
            <span>УГД — Евиденција на студенти</span>
        </div>
        <div class="navbar-right">
            <span class="user-badge" id="userBadge"></span>
            <button class="btn-logout" onclick="logout()">Одјава</button>
        </div>
    </nav>

    <div class="main-content">

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="statTotal">-</div>
                <div class="label">Вкупно записи</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statToday">-</div>
                <div class="label">Присутни денес</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statStudents">-</div>
                <div class="label">Студенти</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statSubjects">-</div>
                <div class="label">Предмети</div>
            </div>
        </div>

        <!-- CHARTS -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="section-title">Присуство по предмет</div>
                <div class="section-divider"></div>
                <canvas id="subjectChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="section-title">Тренд — последните 7 дена</div>
                <div class="section-divider"></div>
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="filters-card">
            <div class="filter-field">
                <label class="field-label">Пребарај студент</label>
                <input type="text" id="filterSearch" class="filter-input" placeholder="Ime..."/>
            </div>
            <div class="filter-field">
                <label class="field-label">Предмет</label>
                <select id="filterSubject" class="filter-input">
                    <option value="">Сите</option>
                </select>
            </div>
            <div class="filter-field">
                <label class="field-label">Од датум</label>
                <input type="date" id="filterDateFrom" class="filter-input"/>
            </div>
            <div class="filter-field">
                <label class="field-label">До датум</label>
                <input type="date" id="filterDateTo" class="filter-input"/>
            </div>
            <button class="btn-filter" onclick="applyFilters()">Филтрирај</button>
            <button class="btn-reset" onclick="resetFilters()">Ресет</button>
        </div>

        <!-- TABLE -->
        <div class="table-card">
            <div class="table-header">
                <div>
                    <div class="section-title">Евиденција на присуство</div>
                    <div class="section-divider" style="margin-bottom:0"></div>
                </div>
                <button class="btn-sync" onclick="bulkSync()">
                    <span id="syncIcon">↻</span> Синхронизирај
                </button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>

            <div id="tableContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Се вчитува...</div>
                </div>
            </div>

            <div class="pagination">
                <div class="pagination-info" id="paginationInfo"></div>
                <div class="pagination-buttons">
                    <button class="btn-page" id="btnPrev" onclick="changePage(-1)">←</button>
                    <div id="pageNumbers" style="display:flex;gap:4px"></div>
                    <button class="btn-page" id="btnNext" onclick="changePage(1)">→</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const SUPABASE_URL = "https://dcmdwnmegcgvktcctnnm.supabase.co/rest/v1";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjbWR3bm1lZ2Nndmt0Y2N0bm5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjg1ODAsImV4cCI6MjA5MzkwNDU4MH0.pUfRKI3HFAGhDMkQL5W1XA1QsAR4lPa89ldnDKMrpsg";

    let currentUser = null;
    let allRecords = [];
    let filteredRecords = [];
    let subjects = [];
    let users = [];
    let currentPage = 1;
    const pageSize = 10;
    let subjectChart = null;
    let trendChart = null;

    const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
    };

    async function login() {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();
        const errorDiv = document.getElementById("loginError");
        errorDiv.textContent = "";

        if (!email || !password) {
            errorDiv.textContent = "Внесете е-маил и лозинка";
            return;
        }

        try {
            const res = await fetch(
                `${SUPABASE_URL}/users?email=eq.${encodeURIComponent(email)}&password_hash=eq.${encodeURIComponent(password)}&select=*`,
                { headers }
            );
            const data = await res.json();

            if (!data.length) {
                errorDiv.textContent = "Погрешен е-маил или лозинка";
                return;
            }

            currentUser = data[0];

            if (currentUser.role !== "teacher" && currentUser.role !== "admin") {
                errorDiv.textContent = "Пристапот е дозволен само за наставници и администратори";
                return;
            }

            document.getElementById("loginPage").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            document.getElementById("userBadge").textContent =
                currentUser.full_name + " (" + currentUser.role + ")";

            await loadDashboard();
        } catch (e) {
            errorDiv.textContent = "Грешка при поврзување: " + e.message;
        }
    }

    function logout() {
        currentUser = null;
        allRecords = [];
        filteredRecords = [];
        document.getElementById("loginPage").style.display = "flex";
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("loginEmail").value = "";
        document.getElementById("loginPassword").value = "";
    }

    async function loadDashboard() {
        await Promise.all([loadSubjects(), loadUsers()]);
        await loadAttendance();
        populateSubjectFilter();
    }

    async function loadSubjects() {
        const res = await fetch(`${SUPABASE_URL}/subjects?select=*`, { headers });
        subjects = await res.json();
    }

    async function loadUsers() {
        const res = await fetch(`${SUPABASE_URL}/users?select=*`, { headers });
        users = await res.json();
    }

    async function loadAttendance() {
        let url = `${SUPABASE_URL}/attendance?select=*&order=timestamp.desc`;
        if (currentUser.role === "teacher") {
            url += `&teacher_id=eq.${currentUser.id}`;
        }
        const res = await fetch(url, { headers });
        allRecords = await res.json();
        filteredRecords = [...allRecords];
        updateStats();
        renderCharts();
        renderTable();
    }

    function populateSubjectFilter() {
        const select = document.getElementById("filterSubject");
        select.innerHTML = '<option value="">Сите</option>';
        subjects.forEach(s => {
            select.innerHTML += `<option value="${s.id}">${s.name}</option>`;
        });
    }

    function getStudentName(id) {
        const u = users.find(u => u.id === id);
        return u ? u.full_name : "Непознат";
    }

    function getSubjectName(id) {
        const s = subjects.find(s => s.id === id);
        return s ? s.name : "Непознат";
    }

    function updateStats() {
        const today = new Date().toISOString().split("T")[0];
        const todayRec = allRecords.filter(r => r.timestamp && r.timestamp.startsWith(today));
        document.getElementById("statTotal").textContent = allRecords.length;
        document.getElementById("statToday").textContent = todayRec.length;
        document.getElementById("statStudents").textContent = new Set(allRecords.map(r => r.student_id)).size;
        document.getElementById("statSubjects").textContent = new Set(allRecords.map(r => r.subject_id)).size;
    }

    function renderCharts() {
        const subjectCounts = {};
        filteredRecords.forEach(r => {
            const name = getSubjectName(r.subject_id);
            subjectCounts[name] = (subjectCounts[name] || 0) + 1;
        });

        if (subjectChart) subjectChart.destroy();
        subjectChart = new Chart(document.getElementById("subjectChart").getContext("2d"), {
            type: "doughnut",
            data: {
                labels: Object.keys(subjectCounts),
                datasets: [{
                    data: Object.values(subjectCounts),
                    backgroundColor: ["#D71920", "#231F20", "#58595B", "#A7A9AC", "#E6E7E8"]
                }]
            },
            options: { responsive: true, plugins: { legend: { position: "bottom" } } }
        });

        const last7 = [];
        const dayCounts = {};
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.toISOString().split("T")[0];
            last7.push(dateStr);
            dayCounts[dateStr] = 0;
        }
        filteredRecords.forEach(r => {
            if (r.timestamp) {
                const date = r.timestamp.split("T")[0];
                if (dayCounts.hasOwnProperty(date)) dayCounts[date]++;
            }
        });

        if (trendChart) trendChart.destroy();
        trendChart = new Chart(document.getElementById("trendChart").getContext("2d"), {
            type: "line",
            data: {
                labels: last7.map(d => d.slice(5)),
                datasets: [{
                    label: "Присуство",
                    data: last7.map(d => dayCounts[d]),
                    borderColor: "#D71920",
                    backgroundColor: "rgba(215,25,32,0.08)",
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: "#D71920"
                }]
            },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });
    }

    function applyFilters() {
        const search = document.getElementById("filterSearch").value.toLowerCase();
        const subjectId = document.getElementById("filterSubject").value;
        const dateFrom = document.getElementById("filterDateFrom").value;
        const dateTo = document.getElementById("filterDateTo").value;

        filteredRecords = allRecords.filter(r => {
            const name = getStudentName(r.student_id).toLowerCase();
            const date = r.timestamp ? r.timestamp.split("T")[0] : "";
            return (!search || name.includes(search))
                && (!subjectId || r.subject_id == subjectId)
                && (!dateFrom || date >= dateFrom)
                && (!dateTo || date <= dateTo);
        });

        currentPage = 1;
        renderCharts();
        renderTable();
    }

    function resetFilters() {
        document.getElementById("filterSearch").value = "";
        document.getElementById("filterSubject").value = "";
        document.getElementById("filterDateFrom").value = "";
        document.getElementById("filterDateTo").value = "";
        filteredRecords = [...allRecords];
        currentPage = 1;
        renderCharts();
        renderTable();
    }

    function renderTable() {
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const page = filteredRecords.slice(start, end);
        const totalPages = Math.ceil(filteredRecords.length / pageSize);

        let html = `<table>
            <thead><tr>
                <th>#</th>
                <th>Студент</th>
                <th>Предмет</th>
                <th>Датум и час</th>
                <th>Статус</th>
            </tr></thead><tbody>`;

        if (page.length === 0) {
            html += `<tr><td colspan="5" style="text-align:center;padding:40px;color:#58595B">Нема записи</td></tr>`;
        } else {
            page.forEach((r, i) => {
                const date = r.timestamp ? new Date(r.timestamp).toLocaleString("mk-MK") : "N/A";
                html += `<tr>
                    <td>${start + i + 1}</td>
                    <td>${getStudentName(r.student_id)}</td>
                    <td>${getSubjectName(r.subject_id)}</td>
                    <td>${date}</td>
                    <td><span class="status-badge">Присутен</span></td>
                </tr>`;
            });
        }
        html += "</tbody></table>";
        document.getElementById("tableContainer").innerHTML = html;

        const s = Math.min(start + 1, filteredRecords.length);
        const e = Math.min(end, filteredRecords.length);
        document.getElementById("paginationInfo").textContent =
            `Прикажани ${s}–${e} од ${filteredRecords.length} записи`;

        let pagesHtml = "";
        for (let i = 1; i <= totalPages; i++) {
            if (i === currentPage || Math.abs(i - currentPage) <= 2) {
                pagesHtml += `<button class="btn-page ${i === currentPage ? 'active' : ''}"
                    onclick="goToPage(${i})">${i}</button>`;
            }
        }
        document.getElementById("pageNumbers").innerHTML = pagesHtml;
        document.getElementById("btnPrev").disabled = currentPage === 1;
        document.getElementById("btnNext").disabled = currentPage >= totalPages;
    }

    function changePage(dir) {
        const total = Math.ceil(filteredRecords.length / pageSize);
        currentPage = Math.max(1, Math.min(currentPage + dir, total));
        renderTable();
    }

    function goToPage(p) {
        currentPage = p;
        renderTable();
    }

    async function bulkSync() {
        const pc = document.getElementById("progressContainer");
        const pf = document.getElementById("progressFill");
        const pt = document.getElementById("progressText");
        const si = document.getElementById("syncIcon");

        pc.style.display = "block";
        si.textContent = "⏳";

        const steps = [
            { text: "Се земаат евиденциите...", p: 25 },
            { text: "Се земаат податоците за студентите...", p: 50 },
            { text: "Се земаат предметите...", p: 75 },
            { text: "Се ажурира dashboard-от...", p: 90 }
        ];

        for (const step of steps) {
            pt.textContent = step.text;
            pf.style.width = step.p + "%";
            await new Promise(r => setTimeout(r, 400));
        }

        await loadDashboard();

        pf.style.width = "100%";
        pt.textContent = "✓ Синхронизацијата е завршена — " + allRecords.length + " записи вчитани";
        si.textContent = "✓";

        setTimeout(() => {
            pc.style.display = "none";
            si.textContent = "↻";
            pf.style.width = "0%";
        }, 2000);
    }
</script>
