<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <!-- ROBOTO -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background: #ffffff;
            color: #111;
        }

        /* LOGIN PAGE */
        #loginPage {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #000000, #D71920);
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-card h1 {
            text-align: center;
            color: #D71920;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .login-card p {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #D71920;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #D71920;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover { background: #a11418; }

        .error-msg {
            color: #d32f2f;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        /* DASHBOARD */
        #dashboard { display: none; }

        .navbar {
            background: #000000;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .navbar h1 { font-size: 20px; }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .btn-logout {
            background: #D71920;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .main-content { padding: 24px; }

        /* STATS CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
            text-align: center;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            color: #D71920;
        }

        .stat-card .label {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        /* CHARTS */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .chart-card h3 {
            margin-bottom: 16px;
            color: #333;
            font-size: 16px;
        }

        /* FILTERS */
        .filters-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filters-card .form-group {
            margin-bottom: 0;
            flex: 1;
            min-width: 150px;
        }

        .btn-filter {
            padding: 12px 24px;
            background: #D71920;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-filter:hover { background: #a11418; }

        /* TABLE */
        .table-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .table-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .table-header h3 { color: #333; }

        .btn-sync {
            padding: 8px 16px;
            background: #D71920;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            width: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .btn-sync:hover { background: #a11418; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            font-size: 14px;
        }

        tr:hover td { background: #f8f9fa; }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-present {
            background: #E8F5E9;
            color: #2E7D32;
        }

        /* PAGINATION */
        .pagination {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f0f0f0;
        }

        .pagination-info { color: #666; font-size: 14px; }

        .pagination-buttons { display: flex; gap: 8px; }

        .btn-page {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            transition: all 0.2s;
        }

        .btn-page:hover { background: #D71920; color: white; border-color: #D71920; }
        .btn-page.active { background: #D71920; color: white; border-color: #D71920; }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }

        /* PROGRESS */
        .progress-container {
            display: none;
            padding: 12px 20px;
            background: #f8f9fa;
            border-top: 1px solid #f0f0f0;
        }

        .progress-bar-track {
            background: #e0e0e0;
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: #D71920;
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
            width: 0%;
        }

        .progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e0e0e0;
            border-top-color: #D71920;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginPage">
    <div class="login-card">
        <h1>🎓 SRS Dashboard</h1>
        <p>Student Registration System</p>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="Enter email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter password">
        </div>

        <button class="btn" onclick="login()">Login</button>
        <div class="error-msg" id="loginError"></div>
    </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard">

    <div class="navbar">
        <h1>🎓 SRS Dashboard</h1>
        <div class="navbar-right">
            <span class="user-badge" id="userBadge">User</span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="main-content">

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="statTotal">0</div>
                <div class="label">Total Records</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statToday">0</div>
                <div class="label">Today's Attendance</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statStudents">0</div>
                <div class="label">Unique Students</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statSubjects">0</div>
                <div class="label">Subjects</div>
            </div>
        </div>

        <!-- CHARTS -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>📊 Attendance by Subject</h3>
                <canvas id="subjectChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>📈 Attendance Trend (Last 7 Days)</h3>
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="filters-card">
            <div class="form-group">
                <label>Search Student</label>
                <input type="text" id="filterSearch">
            </div>

            <div class="form-group">
                <label>Subject</label>
                <select id="filterSubject">
                    <option value="">All</option>
                </select>
            </div>

            <div class="form-group">
                <label>Date From</label>
                <input type="date" id="filterDateFrom">
            </div>

            <div class="form-group">
                <label>Date To</label>
                <input type="date" id="filterDateTo">
            </div>

            <button class="btn-filter" onclick="applyFilters()">Filter</button>
            <button class="btn-filter" onclick="resetFilters()">Reset</button>
        </div>

        <!-- TABLE -->
        <div class="table-card">

            <div class="table-header">
                <h3>Attendance Records</h3>
                <button class="btn-sync" onclick="bulkSync()">🔄 Sync Data</button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>

            <div id="tableContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading...
                </div>
            </div>

            <div class="pagination">
                <div id="paginationInfo"></div>
                <div class="pagination-buttons">
                    <button class="btn-page" id="btnPrev" onclick="changePage(-1)">Prev</button>
                    <div id="pageNumbers"></div>
                    <button class="btn-page" id="btnNext" onclick="changePage(1)">Next</button>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ================= JS (UNCHANGED LOGIC) ================= -->
<script>
const SUPABASE_URL = "https://dcmdwnmegcgvktcctnnm.supabase.co/rest/v1";
const SUPABASE_KEY = "YOUR_KEY";

let currentUser=null;
let allRecords=[];
let filteredRecords=[];
let subjects=[];
let users=[];
let currentPage=1;
const pageSize=10;

const headers={
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY,
Content-Type:"application/json"
};

async function login(){
const email=loginEmail.value;
const password=loginPassword.value;

const res=await fetch(`${SUPABASE_URL}/users?email=eq.${email}&password_hash=eq.${password}`,{headers});
const data=await res.json();

if(!data.length){
loginError.innerText="Invalid login";
return;
}

currentUser=data[0];
loginPage.style.display="none";
dashboard.style.display="block";
userBadge.innerText=currentUser.full_name;

await loadDashboard();
}

function logout(){location.reload();}

async function loadDashboard(){
await loadSubjects();
await loadUsers();
await loadAttendance();
populateSubjectFilter();
}

async function loadSubjects(){
subjects=await (await fetch(`${SUPABASE_URL}/subjects?select=*`,{headers})).json();
}

async function loadUsers(){
users=await (await fetch(`${SUPABASE_URL}/users?select=*`,{headers})).json();
}

async function loadAttendance(){
allRecords=await (await fetch(`${SUPABASE_URL}/attendance?select=*&order=timestamp.desc`,{headers})).json();
filteredRecords=[...allRecords];

updateStats();
renderCharts();
renderTable();
}

function getStudentName(id){
return users.find(u=>u.id==id)?.full_name || "Unknown";
}

function getSubjectName(id){
return subjects.find(s=>s.id==id)?.name || "Unknown";
}

function updateStats(){
const today=new Date().toISOString().split("T")[0];

const todayRecords=allRecords.filter(r=>r.timestamp?.startsWith(today));

statTotal.innerText=allRecords.length;
statToday.innerText=todayRecords.length;
statStudents.innerText=new Set(allRecords.map(r=>r.student_id)).size;
statSubjects.innerText=new Set(allRecords.map(r=>r.subject_id)).size;
}

let subjectChart,trendChart;

function renderCharts(){

const subjectCounts={};
filteredRecords.forEach(r=>{
const name=getSubjectName(r.subject_id);
subjectCounts[name]=(subjectCounts[name]||0)+1;
});

if(subjectChart)subjectChart.destroy();
subjectChart=new Chart(subjectChartCanvas,{
type:"doughnut",
data:{
labels:Object.keys(subjectCounts),
datasets:[{data:Object.values(subjectCounts),backgroundColor:["#D71920","#000"]}]
}
});

const days=[];
const counts={};

for(let i=6;i>=0;i--){
const d=new Date();
d.setDate(d.getDate()-i);
const date=d.toISOString().split("T")[0];
days.push(date);
counts[date]=0;
}

filteredRecords.forEach(r=>{
const d=r.timestamp?.split("T")[0];
if(counts[d]!=undefined)counts[d]++;
});

if(trendChart)trendChart.destroy();
trendChart=new Chart(trendChartCanvas,{
type:"line",
data:{
labels:days,
datasets:[{
data:days.map(d=>counts[d]),
borderColor:"#D71920"
}]
}
});
}

function applyFilters(){
const search=filterSearch.value.toLowerCase();
const subject=filterSubject.value;
const from=filterDateFrom.value;
const to=filterDateTo.value;

filteredRecords=allRecords.filter(r=>{
const name=getStudentName(r.student_id).toLowerCase();
const date=r.timestamp?.split("T")[0];

return (!search||name.includes(search))
&& (!subject||r.subject_id==subject)
&& (!from||date>=from)
&& (!to||date<=to);
});

currentPage=1;
renderCharts();
renderTable();
}

function resetFilters(){
filteredRecords=[...allRecords];
currentPage=1;
renderCharts();
renderTable();
}

function renderTable(){

const start=(currentPage-1)*pageSize;
const end=start+pageSize;

const page=filteredRecords.slice(start,end);

let html=`<table><tr><th>#</th><th>Student</th><th>Subject</th><th>Date</th><th>Status</th></tr>`;

page.forEach((r,i)=>{
html+=`
<tr>
<td>${start+i+1}</td>
<td>${getStudentName(r.student_id)}</td>
<td>${getSubjectName(r.subject_id)}</td>
<td>${r.timestamp}</td>
<td><span class="status-badge status-present">Present</span></td>
</tr>`;
});

html+=`</table>`;
tableContainer.innerHTML=html;

paginationInfo.innerText=`Showing ${start+1}-${end} of ${filteredRecords.length}`;

const totalPages=Math.ceil(filteredRecords.length/pageSize);

let pages="";
for(let i=1;i<=totalPages;i++){
if(i===currentPage||Math.abs(i-currentPage)<=2){
pages+=`<button class="btn-page ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
}
}

pageNumbers.innerHTML=pages;

btnPrev.disabled=currentPage===1;
btnNext.disabled=currentPage===totalPages;
}

function changePage(dir){
const totalPages=Math.ceil(filteredRecords.length/pageSize);
currentPage=Math.max(1,Math.min(totalPages,currentPage+dir));
renderTable();
}

function goToPage(p){
currentPage=p;
renderTable();
}

async function bulkSync(){

progressContainer.style.display="block";

const steps=[
"Fetching records...",
"Fetching users...",
"Fetching subjects...",
"Updating dashboard..."
];

for(let i=0;i<steps.length;i++){
progressText.innerText=steps[i];
progressFill.style.width=((i+1)/steps.length)*100+"%";
await new Promise(r=>setTimeout(r,400));
}

await loadDashboard();

setTimeout(()=>{
progressContainer.style.display="none";
},1500);
}
</script>

</body>
</html>
